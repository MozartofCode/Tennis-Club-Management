# fly launch --no-deploy, then: fly secrets set DATABASE_URL=... JWT_SECRET=...
app = "courtiq"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1  # background jobs (waitlist holds, nightly churn) need a running machine

[[http_service.checks]]
  path = "/api/health"
  interval = "30s"
  timeout = "5s"
